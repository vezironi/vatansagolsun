[project]
name = "vatansagolsun"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.32,<1",
    "pydantic-settings>=2.16,<3",
    "itsdangerous>=2.2,<3",
    "bcrypt>=5,<6",
    "slowapi>=0.1.10,<1",
    "tzdata>=2026.5",
    "httpx>=0.28,<1",
    "selectolax>=0.3,<1",
    "apscheduler>=3.10,<4",
    "anthropic>=2,<3",
    "openai>=3,<4",
    "google-genai>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
