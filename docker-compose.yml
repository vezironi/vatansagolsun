services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vatansagolsun
      POSTGRES_USER: vatansagolsun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_veri:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vatansagolsun -d vatansagolsun"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vatansagolsun:${POSTGRES_PASSWORD}@db/vatansagolsun
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALAN_ADI: ${ALAN_ADI}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_veri:/data
      - caddy_ayar:/config
    depends_on:
      - app

volumes:
  db_veri:
  caddy_veri:
  caddy_ayar:
